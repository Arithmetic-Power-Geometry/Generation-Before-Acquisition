name: validate-closure-cost

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Test
        run: pytest -q
      - name: Generate exact artifacts
        run: python experiments/run_benchmarks.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: closure-cost-artifacts
          path: artifacts/
