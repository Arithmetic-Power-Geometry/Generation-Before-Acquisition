name: finite-frontier-theorem

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  theorem-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Run complete tests
        run: pytest -q
      - name: Generate finite-frontier theorem artifacts
        run: python experiments/frontier_theorem_audit.py
      - name: Upload theorem artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finite-frontier-theorem-artifacts
          path: |
            artifacts/finite_frontier_theorem.json
            artifacts/finite_frontier_cases.csv
