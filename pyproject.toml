[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generation-before-acquisition"
version = "1.0.0"
description = "Exact finite validation of decision-relative generated experiment closure and residual acquisition cost"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["rfs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
